name: Save integrity
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: artemis_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: artemis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artemis_test -d artemis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEMIS_TEST_DATABASE_URL: postgres://artemis_test:isolated-test-only@127.0.0.1:5432/artemis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
